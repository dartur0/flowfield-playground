<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flow field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<div id="controls">
<h3><span class="dot"></span>flow field</h3>

<div class="control">
<label>mode</label>
<select id="modeSelect">
<option value="particles">flow field</option>
<option value="blobs">fluid blobs</option>
</select>
</div>

<div class="control">
<label>theme</label>
<select id="themeSelect">
<option value="aurora">aurora</option>
<option value="sunset">sunset</option>
<option value="graphite">graphite</option>
</select>
</div>

<div class="control">
<label>speed <span id="speedValue">4</span></label>
<input type="range" id="speedSlider" min="0.5" max="6" step="0.1" value="4">
</div>

<div class="control">
<label>noise scale <span id="scaleValue">0.08</span></label>
<input type="range" id="scaleSlider" min="0.01" max="0.3" step="0.01" value="0.08">
</div>

<div class="control" id="particleControl">
<label>particles <span id="countValue">1200</span></label>
<input type="range" id="countSlider" min="200" max="3000" step="100" value="1200">
</div>

<button id="randomizeBtn">randomize</button>
</div>
<script src="main.js"></script>
</body>
</html>
